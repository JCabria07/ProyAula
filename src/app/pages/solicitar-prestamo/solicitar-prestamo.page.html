<ion-content fullscreen>
  <app-navbar></app-navbar>

  <div class="container mt-4">
    <h2 class="mb-4">Solicitar préstamo</h2>

    <!-- Spinner -->
    <div *ngIf="loading" class="text-center py-4">
      <div class="spinner-border text-success" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <p class="mt-2">Procesando solicitud...</p>
    </div>

    <!-- Formulario -->
    <form *ngIf="!loading" (ngSubmit)="enviarSolicitud()" #formPrestamo="ngForm">

      <!-- Activos en acordeón -->
      <ion-accordion-group>
        <ion-accordion value="activos">
          <ion-item slot="header">
            <ion-label>Seleccionar Activos</ion-label>
          </ion-item>
          <div slot="content" class="row">
            <div class="col-md-4 mb-3" *ngFor="let a of activosDisponibles">
              <div class="card h-100 shadow-sm border-0">
                <img [src]="a.url || 'assets/img/placeholder.png'" class="card-img-top" alt="Imagen del activo">
                <div class="card-body">
                  <h5 class="card-title">{{ a.nombre_activo }}</h5>
                  <p class="card-text">
                    <span class="badge" [ngClass]="estadoColorClass(a.estado)">
                      {{ a.estado }}
                    </span>
                  </p>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox"
                           [value]="a.uid"
                           (change)="toggleActivoSeleccionado($event)">
                    <label class="form-check-label">Seleccionar</label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </ion-accordion>
      </ion-accordion-group>

      <!-- Fecha inicio con ion-datetime -->
      <div class="mb-3">
        <label class="form-label">Fecha inicio</label>
        <ion-datetime
          [(ngModel)]="form.fechaInicio"
          name="fechaInicio"
          presentation="date"
          class="shadow"
          [isDateEnabled]="isDateEnabled"
          (ionChange)="recalcularDevolucion()">
        </ion-datetime>
      </div>

      <!-- Días solicitados -->
      <div class="mb-3">
        <label class="form-label">Días solicitados</label>
        <input type="number" class="form-control" [(ngModel)]="form.dias" name="dias" min="1" max="30"
               (input)="recalcularDevolucion()" required>
      </div>

      <!-- Fecha devolución -->
      <div class="mb-3">
        <label class="form-label">Fecha devolución</label>
        <input type="text" class="form-control" [value]="form.fechaDevolucion" readonly>
      </div>

      <!-- Solicitante (readonly desde localStorage) -->
      <div class="mb-3">
        <label class="form-label">Solicitante</label>
        <input type="email" class="form-control" [(ngModel)]="form.solicitanteEmail" name="solicitanteEmail" readonly>
      </div>

      <!-- Observaciones -->
      <div class="mb-3">
        <label class="form-label">Observaciones</label>
        <textarea class="form-control" [(ngModel)]="form.observaciones" name="observaciones" maxlength="500"></textarea>
      </div>

      <!-- Advertencia de conflicto -->
      <div *ngIf="conflicto" class="alert alert-warning">
        El activo tiene un préstamo en ese rango. Ajusta la fecha o días.
      </div>

      <!-- Botones -->
      <div class="d-flex justify-content-end gap-2">
        <button type="submit" class="btn btn-success" [disabled]="!formPrestamo.form.valid || conflicto">
          Enviar solicitud
        </button>
      </div>
    </form>
  </div>

  <!-- Confirmación con Ion Alert -->
  <ion-alert
    [isOpen]="isConfirmOpen"
    header="Confirmar envío"
    message="¿Desea enviar esta solicitud de préstamo?"
    [buttons]="confirmButtons"
    (didDismiss)="isConfirmOpen=false">
  </ion-alert>

  <app-footer></app-footer>
</ion-content>
